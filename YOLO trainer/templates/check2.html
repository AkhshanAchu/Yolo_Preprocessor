<html lang="en">
<head>

    <meta charset="UTF-8">
    <script src="https://unpkg.com/dropzone@5/dist/min/dropzone.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/dropzone@5/dist/min/dropzone.min.css" type="text/css" />

    <title>File Dropper</title>
</head>
<style>
    

    body{
        background-image: linear-gradient(180deg, rgba(2,0,36,1) 0%, rgba(9,17,121,1) 35%, rgba(0,212,255,1) 100%);
        background-position: center;
        background-origin: content-box;
        background-repeat: no-repeat;
        background-size: cover;
        min-height:100vh;
        font-family: 'Noto Sans', sans-serif;
    }
    .text-center{
        color:#fff;	
        text-transform:uppercase;
        font-size: 23px;
        margin: -50px 0 80px 0;
        display: block;
        text-align: center;
    }
    .box{
        position:absolute;
        left:50%;
        top:50%;
        transform: translate(-50%,-50%);
        background-color: rgba(0, 0, 0, 0.89);
        border-radius:3px;
        padding:70px 100px;
    }
    .input-container{
        position:relative;
        margin-bottom:25px;
    }
    .input-container label{
        position:absolute;
        top:0px;
        left:0px;
        font-size:16px;
        color:#fff;	
        pointer-event:none;
        transition: all 0.5s ease-in-out;
    }
    .input-container input{ 
      border:0;
      border-bottom:1px solid #555;  
      background:transparent;
      width:100%;
      padding:8px 0 5px 0;
      font-size:16px;
      color:#fff;
    }
    .input-container input:focus{ 
     border:none;	
     outline:none;
     border-bottom:1px solid #e74c3c;	
    }
    .btn{
        color:#fff;
        background-color:#e74c3c;
        outline: none;
        border: 0;
        color: #fff;
        padding:10px 20px;
        text-transform:uppercase;
        margin-top:50px;
        border-radius:2px;
        cursor:pointer;
        position:relative;
    }
    /*.btn:after{
        content:"";
        position:absolute;
        background:rgba(0,0,0,0.50);
        top:0;
        right:0;
        width:100%;
        height:100%;
    }*/
    label {
      color: #ffffff;
      font-weight: bold;
      display: block;
    }
    .input-container input:focus ~ label,
    .input-container input:valid ~ label{
        top:-12px;
        font-size:12px;
        
    }
    </style>
    

<body>
<h1 style="color :#fff;text-align: Center;">Please upload images and labels in .zip only</h1>
    <form
    method="POST"
    action="/upload"
    class="dropzone dz-clickable"
    id="dropper"
    enctype="multipart/form-data"
    >
    </form>
    <script type="application/javascript">
        Dropzone.options.dropper = {
            paramName: "file",
            chunking: true,
            forceChunking: true,
            url: "/upload",
            maxFilesize: 1025, // megabytes
            chunkSize: 1000000 // bytes
        }
    </script>
    <div class="input-container">
    <form
        method="POST"
        action="/jump"
    >
    <input type="submit">
    </form>
</div>

</body>
</html>
